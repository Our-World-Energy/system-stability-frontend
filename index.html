    <!-- Google tag (gtag.js) — System Stability GA4 property only, never owehub's.
         This id must stay identical to GA_MEASUREMENT_ID in
         src/analytics/googleAnalytics.ts; a test fails if they drift apart. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-HHY7CK0XT4"></script>
    <script>
      window.dataLayer = window.dataLayer || []
      function gtag() {
        dataLayer.push(arguments)
      }
      gtag('js', new Date())
      // Page views are sent by hand from src/analytics — leaving the automatic
      // ones on would count every SPA route change twice.
      gtag('config', 'G-HHY7CK0XT4', { send_page_view: false })
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
